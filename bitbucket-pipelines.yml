image: node:24

clone:
  depth: full   # nx affected needs history to compare against

definitions:
  caches:
    npm: ~/.npm

steps:
  - step: &e2e
      name: E2E (Playwright + axe)
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      caches:
        - npm
      script:
        - npm ci
        - npx prisma generate
        - npx nx run-many -t e2e --exclude=@trip-desk/api-e2e
      artifacts:
        - apps/web-e2e/test-output/**


pipelines:
  pull-requests:
    '**':
      - step:
          name: Lint, test, build (affected)
          caches:
            - npm
          script:
            - npm ci
            - npx prisma generate
            - git fetch origin $BITBUCKET_PR_DESTINATION_BRANCH
            - npx nx affected -t lint test build --base=origin/$BITBUCKET_PR_DESTINATION_BRANCH --head=HEAD
      - step: *e2e
  branches:
    main:
      - step:
          name: Lint, test, build (all)
          caches:
            - npm
          script:
            - npm ci
            - npx prisma generate
            - npx nx run-many -t lint test build
      - step: *e2e
